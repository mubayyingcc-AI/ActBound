[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actbound-prototype"
version = "0.2.0"
description = "Local sandbox prototype for high-consequence AI-agent action enforcement"
requires-python = ">=3.11"
dependencies = ["cryptography>=41", "fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["actbound", "actbound.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
